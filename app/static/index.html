<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai-workspace</title>
  <style>
    :root {
      --ground: #fff;
      --ink: #1a1a1a;
      --muted: #595959;
      --line: #ddd;
      --panel: #f6f6f6;
      --danger: #b00020;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background: var(--ground);
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.75rem; }
    h2 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    section { margin-bottom: 2.5rem; }
    .section-intro { color: var(--muted); margin: 0.25rem 0 1rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 0.25rem; }
    input, select, textarea { font: inherit; padding: 0.4rem; border: 1px solid var(--line); border-radius: 4px; }
    input { flex: 1; }
    button { padding: 0.4rem 1rem; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--ground); cursor: pointer; }
    button:hover { background: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error, #error, .save-error { color: var(--danger); min-height: 1.2em; margin: 0 0 1rem; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; }
    pre { white-space: pre-wrap; background: var(--panel); padding: 0.5rem; margin: 0.5rem 0 0; }
    textarea { width: 100%; min-height: 8rem; font-family: inherit; margin-top: 0.5rem; }
    .edit-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .edit-actions[hidden] { display: none; }

    .new-worker-form { display: flex; flex-direction: column; gap: 1rem; max-width: 480px; }
    .field { display: flex; flex-direction: column; }
    .field select, .field input { width: 100%; }
    #preview {
      max-height: 16rem;
      overflow: auto;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Workers</h1>

  <section aria-labelledby="new-worker-heading">
    <h2 id="new-worker-heading">New worker</h2>
    <p class="section-intro">Pick a starting template, name the worker and describe its role. The preview below is exactly what gets written to its CLAUDE.md.</p>

    <form id="new-worker-form" class="new-worker-form">
      <div class="field">
        <label for="template-select">Template</label>
        <select id="template-select">
          <option value="">Blank (no template)</option>
        </select>
      </div>

      <div class="field">
        <label for="new-worker-name">Name</label>
        <input id="new-worker-name" placeholder="code-reviewer" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="new-worker-role">Role</label>
        <input id="new-worker-role" placeholder="Reviews pull requests for bugs and style" autocomplete="off">
      </div>

      <div class="field">
        <label for="preview">Preview: CLAUDE.md</label>
        <pre id="preview">(fill in the fields above)</pre>
      </div>

      <p class="error" id="new-worker-error"></p>
      <button type="submit">Create worker</button>
    </form>
  </section>

  <section aria-labelledby="workers-heading">
    <h2 id="workers-heading">Existing workers <span id="count">(0)</span></h2>

    <form id="quick-create-form">
      <input id="name" placeholder="new-worker-name" autocomplete="off" required>
      <button type="submit">Quick create</button>
    </form>
    <p id="error"></p>

    <p id="empty" hidden>No workers yet.</p>
    <ul id="workers"></ul>
  </section>

  <script>
    const list = document.getElementById("workers");
    const empty = document.getElementById("empty");
    const error = document.getElementById("error");
    const count = document.getElementById("count");

    function addWorker(worker) {
      const li = document.createElement("li");
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const pre = document.createElement("pre");
      const editButton = document.createElement("button");
      const textarea = document.createElement("textarea");
      const actions = document.createElement("div");
      const saveButton = document.createElement("button");
      const cancelButton = document.createElement("button");
      const saveError = document.createElement("p");

      summary.textContent = worker.name;
      pre.textContent = worker.instructions;
      editButton.textContent = "Edit";
      textarea.hidden = true;
      textarea.value = worker.instructions;
      saveButton.textContent = "Save";
      cancelButton.textContent = "Cancel";
      actions.className = "edit-actions";
      actions.hidden = true;
      actions.append(saveButton, cancelButton);
      saveError.className = "save-error";

      editButton.addEventListener("click", () => {
        pre.hidden = true;
        editButton.hidden = true;
        textarea.hidden = false;
        actions.hidden = false;
        textarea.focus();
      });

      cancelButton.addEventListener("click", () => {
        textarea.value = worker.instructions;
        saveError.textContent = "";
        pre.hidden = false;
        editButton.hidden = false;
        textarea.hidden = true;
        actions.hidden = true;
      });

      saveButton.addEventListener("click", async () => {
        saveError.textContent = "";
        const res = await fetch(`/workers/${encodeURIComponent(worker.name)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ instructions: textarea.value }),
        });
        if (res.status === 200) {
          const updated = await res.json();
          // What the server stored is the single source of truth for both
          // the display and the next edit.
          worker.instructions = updated.instructions;
          pre.textContent = updated.instructions;
          textarea.value = updated.instructions;
          pre.hidden = false;
          editButton.hidden = false;
          textarea.hidden = true;
          actions.hidden = true;
        } else if (res.status === 404) {
          saveError.textContent = "This worker no longer exists.";
        } else {
          saveError.textContent = `Something went wrong (HTTP ${res.status}).`;
        }
      });

      details.append(summary, pre, editButton, textarea, actions, saveError);
      li.append(details);
      list.append(li);
      empty.hidden = true;
    }

    async function loadWorkers() {
      const res = await fetch("/workers");
      const workers = await res.json();
      list.replaceChildren();
      workers.forEach(addWorker);
      empty.hidden = workers.length > 0;
      count.textContent = `(${workers.length})`;
    }

    document.getElementById("quick-create-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("name");
      error.textContent = "";
      const res = await fetch("/workers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: input.value.trim() }),
      });
      if (res.status === 201) {
        input.value = "";
        await loadWorkers();
      } else if (res.status === 409) {
        error.textContent = "A worker with that name already exists.";
      } else if (res.status === 400) {
        error.textContent = "Use lowercase letters, numbers and single dashes (e.g. code-reviewer), up to 40 characters.";
      } else {
        error.textContent = `Something went wrong (HTTP ${res.status}).`;
      }
    });

    // --- New worker (from template) ---

    const templateSelect = document.getElementById("template-select");
    const nameInput = document.getElementById("new-worker-name");
    const roleInput = document.getElementById("new-worker-role");
    const preview = document.getElementById("preview");
    const newWorkerError = document.getElementById("new-worker-error");
    const newWorkerForm = document.getElementById("new-worker-form");

    const templateBodies = new Map();

    function starterInstructions(name) {
      return `# ${name || "worker-name"}\n\nDescribe what this worker does and how it should work.\n`;
    }

    function buildInstructions() {
      const name = nameInput.value.trim();
      const role = roleInput.value.trim();
      const templateName = templateSelect.value;
      const body = templateName ? templateBodies.get(templateName) : starterInstructions(name);
      const lines = (body || "").split("\n");
      const hasHeading = lines[0].startsWith("# ");
      const rest = (hasHeading ? lines.slice(1).join("\n") : body || "").replace(/^\n+/, "");
      const heading = `# ${name || "worker-name"}`;
      const roleLine = role ? `\n**Role:** ${role}\n` : "";
      return `${heading}\n${roleLine}\n${rest}`.replace(/\n{3,}/g, "\n\n");
    }

    function updatePreview() {
      preview.textContent = buildInstructions();
    }

    async function loadTemplates() {
      const res = await fetch("/templates");
      if (!res.ok) {
        newWorkerError.textContent = "Could not load templates; you can still create a blank worker.";
        return;
      }
      const templates = await res.json();
      for (const template of templates) {
        const option = document.createElement("option");
        option.value = template.name;
        option.textContent = template.description ? `${template.name} — ${template.description}` : template.name;
        templateSelect.append(option);
      }
    }

    const createButton = newWorkerForm.querySelector("button[type=submit]");

    async function ensureTemplateLoaded(name) {
      if (!name || templateBodies.has(name)) return;
      createButton.disabled = true;
      try {
        const res = await fetch(`/templates/${encodeURIComponent(name)}`);
        if (res.ok) {
          const data = await res.json();
          templateBodies.set(name, data.content);
        } else {
          newWorkerError.textContent = `Could not load that template (HTTP ${res.status}).`;
        }
      } finally {
        createButton.disabled = false;
      }
    }

    templateSelect.addEventListener("change", async () => {
      newWorkerError.textContent = "";
      await ensureTemplateLoaded(templateSelect.value);
      updatePreview();
    });

    nameInput.addEventListener("input", updatePreview);
    roleInput.addEventListener("input", updatePreview);

    newWorkerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      newWorkerError.textContent = "";
      await ensureTemplateLoaded(templateSelect.value);
      const name = nameInput.value.trim();
      const instructions = buildInstructions();

      // One call: name and content together, so there is no half-created
      // worker if anything fails.
      const createRes = await fetch("/workers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, instructions }),
      });

      if (createRes.status === 409) {
        newWorkerError.textContent = "A worker with that name already exists.";
        return;
      }
      if (createRes.status === 400) {
        newWorkerError.textContent = "Use lowercase letters, numbers and single dashes (e.g. code-reviewer), up to 40 characters.";
        return;
      }
      if (createRes.status !== 201) {
        newWorkerError.textContent = `Something went wrong (HTTP ${createRes.status}).`;
        return;
      }

      nameInput.value = "";
      roleInput.value = "";
      templateSelect.value = "";
      updatePreview();
      await loadWorkers();
    });

    updatePreview();
    loadTemplates();
    loadWorkers();
  </script>
</body>
</html>
